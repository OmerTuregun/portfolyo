name: Issue Agent

on:
  issues:
    types: [labeled]

concurrency:
  group: issue-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent:
    if: github.event.label.name == 'agent' && github.event.sender.login == github.repository_owner
    runs-on: [self-hosted, portfolyo]
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      BRANCH: agent/issue-${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Başladığını bildir
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Ajan bu issue üzerinde çalışmaya başladı. Canlı log: $RUN_URL"

      - name: Ajanı çalıştır
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          git checkout -B "$BRANCH"
          cat > "$RUNNER_TEMP/prompt.md" <<EOF
          GitHub issue #$ISSUE_NUMBER üzerinde çalışıyorsun. Önce AGENTS.md dosyasını oku ve kurallarına uy.

          Başlık: $ISSUE_TITLE

          $ISSUE_BODY

          İşin bitince son mesajında yaptığın değişikliklerin kısa bir Türkçe özetini yaz.
          EOF
          ~/.local/bin/agent -p --force --trust --output-format text "$(cat "$RUNNER_TEMP/prompt.md")" | tee "$RUNNER_TEMP/agent-output.md"

      - name: Build kontrolü
        id: build
        continue-on-error: true
        run: dotnet build My-Portfolyo.csproj -c Release -nologo

      - name: PR aç
        id: pr
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          SUMMARY=$(head -c 60000 "$RUNNER_TEMP/agent-output.md")
          if [ -z "$(git status --porcelain)" ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file - <<EOF
          Ajan kodda bir değişiklik yapmadı.

          $SUMMARY
          EOF
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "$ISSUE_TITLE (#$ISSUE_NUMBER)"
          git push -q -f origin "$BRANCH"

          if [ "$BUILD_OUTCOME" = "success" ]; then
            BUILD_LINE="Build: başarılı"
            DRAFT=""
          else
            BUILD_LINE="Build: BAŞARISIZ, merge etmeden önce kontrol et ($RUN_URL)"
            DRAFT="--draft"
          fi

          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Closes #$ISSUE_NUMBER

          $BUILD_LINE

          Build başarılıysa ajan bu PR'ı kendisi merge edip canlıya deploy eder.

          ## Ajanın özeti

          $SUMMARY
          EOF

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/pr-body.md"
            PR_URL=$(gh pr view "$BRANCH" --json url --jq .url)
          else
            PR_URL=$(gh pr create --base main --head "$BRANCH" --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/pr-body.md" $DRAFT)
          fi
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          if [ "$BUILD_OUTCOME" != "success" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "PR taslak olarak açıldı, build başarısız olduğu için merge edilmedi: $PR_URL"
          fi

      - name: Merge et
        if: steps.pr.outputs.url != '' && steps.build.outcome == 'success'
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/${PR_URL##*/}/merge" -f merge_method=squash >/dev/null
          git push -q origin --delete "$BRANCH" || true

      # GITHUB_TOKEN ile yapılan merge Deploy workflow'unu tetiklemez, bu yüzden deploy burada yapılır.
      - name: Canlıya deploy et
        if: steps.pr.outputs.url != '' && steps.build.outcome == 'success'
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if sudo -n /usr/local/sbin/deploy-portfolyo; then
            gh issue comment "$ISSUE_NUMBER" --body "Merge edildi ve canlıya deploy edildi: $PR_URL"
          else
            gh issue comment "$ISSUE_NUMBER" --body "Merge edildi ama deploy başarısız oldu, site önceki sürüme geri alındı. Log: $RUN_URL"
            exit 1
          fi

      - name: Hata bildir
        if: failure()
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Ajan çalışırken hata oluştu. Log: $RUN_URL"
